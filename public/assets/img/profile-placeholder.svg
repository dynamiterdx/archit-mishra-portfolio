<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1215"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" x2="1">
      <stop offset="0" stop-color="#ff234a"/>
      <stop offset="1" stop-color="#e5103a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="url(#bg)"/>
  <g opacity=".12">
    <defs>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M24 0H0v24" fill="none" stroke="#ff234a" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>
  <circle cx="200" cy="160" r="70" fill="url(#acc)" opacity=".25"/>
  <rect x="80" y="250" width="240" height="150" rx="20" fill="url(#acc)" opacity=".18"/>
  <text x="200" y="440" text-anchor="middle" fill="#ff758d" font-family="Orbitron, monospace" font-size="18">Your Photo Here</text>
</svg>

