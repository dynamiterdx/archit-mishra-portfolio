<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1215"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff234a"/>
      <stop offset="1" stop-color="#e5103a"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <g opacity="0.12">
    <defs>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M32 0H0v32" fill="none" stroke="#ff234a" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>
  <g font-family="Orbitron, monospace" text-anchor="middle" fill="url(#glow)">
    <text x="400" y="210" font-size="40">Project Thumbnail</text>
    <text x="400" y="250" font-size="18" fill="#ff758d">Replace with your image</text>
  </g>
  <circle cx="660" cy="90" r="70" fill="url(#glow)" opacity="0.15"/>
  <circle cx="120" cy="360" r="90" fill="url(#glow)" opacity="0.12"/>
  <rect x="40" y="40" width="720" height="370" fill="none" stroke="#ff375a" stroke-opacity="0.2"/>
  <rect x="52" y="52" width="696" height="346" fill="none" stroke="#ff375a" stroke-opacity="0.18"/>
  <rect x="64" y="64" width="672" height="322" fill="none" stroke="#ff375a" stroke-opacity="0.15"/>
  <rect x="76" y="76" width="648" height="298" fill="none" stroke="#ff375a" stroke-opacity="0.12"/>
  <rect x="88" y="88" width="624" height="274" fill="none" stroke="#ff375a" stroke-opacity="0.1"/>
  <rect x="100" y="100" width="600" height="250" fill="none" stroke="#ff375a" stroke-opacity="0.08"/>
  <rect x="112" y="112" width="576" height="226" fill="none" stroke="#ff375a" stroke-opacity="0.06"/>
  <rect x="124" y="124" width="552" height="202" fill="none" stroke="#ff375a" stroke-opacity="0.05"/>
</svg>

